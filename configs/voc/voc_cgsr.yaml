# CGSR paper-facing evaluation config: voc
# All values equal the frozen run configuration. DATAROOT, TEXT_WEIGHT, LOAD_PATH and
# SAVE_DIR are placeholders; tools/eval_cgsr.py sets them from --data-root,
# --text-embedding and --checkpoint. The candidate generator and CGSR have no YAML keys.
# Base config: the schema and values follow the ReCLIP++ configuration files (Wang & Kang);
# see THIRD_PARTY_NOTICES.md.
DATASET:
  NAME: 'voc'
  NUM_CLASSES: 20
  DATAROOT: '/path/to/VOCdevkit/VOC2012/'
  SCALE: [2048, 336]
  RATIO_RANGE: [0.5, 2.0]
  CROP_SIZE: [512, 512]
  CAT_MAX_RATIO: 0.75
  IMG_NORM_CFG:
    MEAN: [ 122.771, 116.746, 104.094 ]
    STD: [ 68.501, 66.632, 70.323 ]
    RGB: True
  TEXT_WEIGHT: 'weights/text/voc_ViT16_clip_text.pth'
  REDUCE_ZERO_LABEL: TRUE
  PALETTE: [[128, 0, 0], [0, 128, 0], [128, 128, 0], [0, 0, 128],
               [128, 0, 128], [0, 128, 128], [128, 128, 128], [64, 0, 0],
               [192, 0, 0], [64, 128, 0], [192, 128, 0], [64, 0, 128],
               [192, 0, 128], [64, 128, 128], [192, 128, 128], [0, 64, 0],
               [128, 64, 0], [0, 192, 0], [128, 192, 0], [0, 64, 128]]

MODEL:
  FEATURE_EXTRACTOR: 'vit'
  TEXT_CHANNEL: 512
  VISUAL_CHANNEL: 768
  TRAINING: False

TEST:
  BATCH_SIZE: 1
  PD: 1.0

EVAL_METRIC: "miou"
SAVE_DIR: 'outputs/voc/'
LOAD_PATH: 'weights/voc.pth'
NUM_WORKERS: 4
